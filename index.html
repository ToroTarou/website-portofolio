<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portofolio Game</title>
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #111827;
      --tag-bg: #f3f4f6;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Container */
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Navbar & Header (Simpel ala iamdeantate) */
    header {
      padding: 56px 0 40px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 48px;
    }
    .brand h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .brand p {
      color: var(--muted);
      font-size: 1rem;
      margin-top: 4px;
    }
    nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    nav a {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--text); }

    /* Grid Game (Simpel, Fokus ke Visual) */
    .section-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 20px;
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 28px;
      margin-bottom: 72px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.07);
      border-color: #d1d5db;
    }
    .card-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #e5e7eb;
      overflow: hidden;
      position: relative;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
      display: block;
    }
    .card:hover .card-thumb img {
      transform: scale(1.04);
    }
    .card-body {
      padding: 18px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .card-year {
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .card-role {
      font-size: 0.9rem;
      color: var(--muted);
    }
    .card-hint {
      margin-top: auto;
      padding-top: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .card:hover .card-hint { opacity: 1; }

    /* About & Footer */
    .about-section {
      border-top: 1px solid var(--border);
      padding: 48px 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }
    .about-section h2 {
      font-size: 1.3rem;
      margin-bottom: 12px;
    }
    .about-section p {
      color: #374151;
      font-size: 0.96rem;
    }
    .skills-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .tag {
      background: var(--tag-bg);
      color: #374151;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.83rem;
      font-weight: 500;
    }
    footer {
      border-top: 1px solid var(--border);
      padding: 28px 0 48px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* MODAL DETAIL (Informatif ala Gerlogu) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.72);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px;
      z-index: 1000;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      width: 100%;
      max-width: 820px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
      animation: modalIn 0.22s ease;
      position: relative;
      margin-bottom: 32px;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-close {
      position: sticky;
      top: 16px;
      float: right;
      margin: 16px 16px -56px 0;
      z-index: 10;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(17, 24, 39, 0.75);
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .modal-close:hover { background: #111827; }
    .modal-hero {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #1f2937;
      object-fit: cover;
      display: block;
    }
    .modal-content {
      padding: 32px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }
    .modal-header h2 {
      font-size: 1.85rem;
      letter-spacing: -0.02em;
    }
    .modal-tagline {
      color: var(--muted);
      margin-top: 4px;
      font-size: 1rem;
    }
    .modal-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-link {
      display: inline-block;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      background: var(--accent);
      color: #fff;
      transition: opacity 0.2s;
    }
    .btn-link.secondary {
      background: var(--tag-bg);
      color: var(--text);
    }
    .btn-link:hover { opacity: 0.85; }

    /* Kotak Info Proyek (Role, Tim, Tools, Durasi) */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 28px;
    }
    .meta-item span {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 2px;
      font-weight: 600;
    }
    .meta-item strong {
      font-size: 0.93rem;
      color: var(--text);
    }

    /* Isi Kontribusi */
    .modal-section {
      margin-bottom: 28px;
    }
    .modal-section h3 {
      font-size: 1.1rem;
      margin-bottom: 10px;
      color: var(--text);
      border-left: 3px solid var(--accent);
      padding-left: 10px;
    }
    .modal-section p {
      color: #374151;
      font-size: 0.96rem;
    }
    .contrib-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .contrib-list li {
      position: relative;
      padding-left: 22px;
      color: #374151;
      font-size: 0.95rem;
    }
    .contrib-list li::before {
      content: "→";
      position: absolute;
      left: 0;
      color: var(--text);
      font-weight: 700;
    }

    /* Galeri Breakdown di dalam Modal */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin-top: 12px;
    }
    .gallery-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: #f9fafb;
    }
    .gallery-item img {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      display: block;
    }
    .gallery-caption {
      padding: 8px 12px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    @media (max-width: 680px) {
      .about-section { grid-template-columns: 1fr; }
      .modal-content { padding: 20px; }
      header { padding: 36px 0 28px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <h1 id="site-name"></h1>
        <p id="site-role"></p>
      </div>
      <nav id="site-nav"></nav>
    </header>

    <main>
      <div class="section-label">Selected Games & Projects</div>
      <div class="grid" id="projects-grid"></div>
    </main>

    <section class="about-section" id="about">
      <div>
        <h2>Tentang Saya</h2>
        <p id="about-text"></p>
      </div>
      <div>
        <h2>Tools & Keahlian</h2>
        <div class="skills-wrap" id="skills-list"></div>
      </div>
    </section>

    <footer id="contact">
      <div id="footer-copy"></div>
      <div id="footer-links"></div>
    </footer>
  </div>

  <!-- Jendela Detail Game (Muncul saat kartu diklik) -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="Tutup">×</button>
      <img class="modal-hero" id="modal-hero" src="" alt="" />
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <h2 id="modal-title"></h2>
            <p class="modal-tagline" id="modal-tagline"></p>
          </div>
          <div class="modal-links" id="modal-links"></div>
        </div>

        <div class="meta-grid" id="modal-meta"></div>

        <div class="modal-section">
          <h3>Tentang Game</h3>
          <p id="modal-overview"></p>
        </div>

        <div class="modal-section">
          <h3>Kontribusi Saya</h3>
          <ul class="contrib-list" id="modal-contributions"></ul>
        </div>

        <div class="modal-section" id="modal-gallery-section">
          <h3>Showcase & Breakdown</h3>
          <div class="gallery-grid" id="modal-gallery"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    //  EDIT DATA KAMU DI SINI (Cukup ubah teks di dalam tanda kutip "...")
    // =========================================================================

    const PROFILE = {
      nama: "ToroTarou",
      peran: "2D & 3D Game Artist",
      tentang: "Saya adalah mahasiswa Teknologi Game yang berfokus pada pembuatan aset 2D/3D, environment, dan integrasi visual di dalam game engine. Senang mengeksplorasi gaya stylized dan optimasi aset agar tetap ringan dijalankan.",
      skills: ["Blender", "Unity", "Godot", "Substance Designer", "3D Modeling", "Texturing", "Environment Art", "Shader Dasar"],
      email: "emailkamu@gmail.com",
      // Link di pojok kanan atas & bawah (hapus baris yang tidak dipakai)
      sosmed: [
        { label: "Itch.io", url: "https://itch.io" },
        { label: "ArtStation", url: "https://artstation.com" },
        { label: "GitHub", url: "https://github.com/ToroTarou" },
        { label: "LinkedIn", url: "https://linkedin.com" }
      ]
    };

    // DAFTAR GAME / PROYEK
    // Tips: Untuk pakai gambar sendiri, buat folder bernama "images" di samping index.html,
    // taruh gambarnya di sana (misal: game1.jpg), lalu tulis thumbnail: "images/game1.jpg"
    const PROJECTS = [
      {
        title: "Nama Game Pertama",
        year: "2026",
        role: "3D Environment & Prop Artist",
        tagline: "Game petualangan 3D bergaya stylized yang dibuat bersama tim.",
        thumbnail: "https://placehold.co/800x450/1e293b/38bdf8?text=Thumbnail+Game+1",
        meta: {
          "Peran": "3D Artist",
          "Ukuran Tim": "5 Orang",
          "Engine / Tools": "Unity, Blender, Substance",
          "Durasi": "3 Bulan"
        },
        links: [
          { label: "Mainkan di Itch.io", url: "https://itch.io", primary: true },
          { label: "Lihat Trailer", url: "https://youtube.com", primary: false }
        ],
        overview: "Jelaskan secara singkat game ini tentang apa, genre-nya apa, dan dibuat dalam rangka apa (misalnya proyek kuliah, Tugas Akhir, atau Game Jam).",
        contributions: [
          "Membuat lebih dari 20 aset 3D environment modular (bangunan, pepohonan, bebatuan) di Blender dengan topologi low-poly yang rapi.",
          "Membuat tekstur stylized dan material prosedural menggunakan Substance Designer.",
          "Mengatur lighting, post-processing, dan penempatan aset (set dressing) langsung di dalam scene Unity.",
          "Mengoptimasi jumlah draw call dan overdraw pada foliage agar performa stabil di 60 FPS."
        ],
        gallery: [
          {
            img: "https://placehold.co/600x375/0f172a/94a3b8?text=Screenshot+In-Game",
            caption: "Tampilan environment final di dalam Unity."
          },
          {
            img: "https://placehold.co/600x375/0f172a/94a3b8?text=Wireframe+%2F+Asset+Pack",
            caption: "Breakdown aset props dan wireframe di Blender."
          }
        ]
      },
      {
        title: "Nama Game Kedua",
        year: "2025",
        role: "2D Artist & UI Designer",
        tagline: "Game 2D hasil karya Game Jam selama 48 jam.",
        thumbnail: "https://placehold.co/800x450/312e81/c4b5fd?text=Thumbnail+Game+2",
        meta: {
          "Peran": "2D & UI Artist",
          "Ukuran Tim": "4 Orang",
          "Engine / Tools": "Unity, Photoshop",
          "Durasi": "48 Jam (Game Jam)"
        },
        links: [
          { label: "Halaman Game Jam", url: "https://itch.io", primary: true }
        ],
        overview: "Ceritakan konsep singkat game kedua kamu di sini. Pengunjung atau rekruter sangat suka membaca konteks singkat sebelum melihat kontribusi kamu.",
        contributions: [
          "Mendesain karakter utama lengkap dengan sprite animasi idle, jalan, dan lompat.",
          "Membuat seluruh aset HUD, menu utama, ikon item, dan layar pause.",
          "Menentukan palet warna agar karakter tetap kontras dan mudah dibaca terhadap background."
        ],
        gallery: [
          {
            img: "https://placehold.co/600x375/1e1b4b/a5b4fc?text=Sprite+Sheet+%26+UI",
            caption: "Desain UI dan sprite karakter."
          }
        ]
      },
      {
        title: "Eksperimen Water Shader",
        year: "2026",
        role: "Technical Art / Solo Project",
        tagline: "Prototipe shader air interaktif dengan riak dinamis.",
        thumbnail: "https://placehold.co/800x450/064e3b/6ee7b7?text=Thumbnail+Proyek+3",
        meta: {
          "Peran": "Solo Developer",
          "Ukuran Tim": "1 Orang",
          "Engine / Tools": "Unity / Godot",
          "Status": "Prototipe"
        },
        links: [
          { label: "Repository GitHub", url: "https://github.com/ToroTarou", primary: false }
        ],
        overview: "Selain game penuh, kamu juga bisa memajang proyek eksperimen seperti shader, tool, atau diorama 3D di sini.",
        contributions: [
          "Merancang sistem riak air yang bereaksi secara real-time saat objek menyentuh permukaan air.",
          "Menyusun parameter warna, kecepatan ombak, dan skala riak agar mudah diatur di Inspector."
        ],
        gallery: [] // Biarkan kosong [] jika tidak ingin menampilkan galeri tambahan
      }
    ];

    // =========================================================================
    //  AREA KODE OTOMATIS (Tidak perlu diubah)
    // =========================================================================

    document.title = `${PROFILE.nama} — ${PROFILE.peran}`;
    document.getElementById("site-name").textContent = PROFILE.nama;
    document.getElementById("site-role").textContent = PROFILE.peran;
    document.getElementById("about-text").textContent = PROFILE.tentang;
    document.getElementById("footer-copy").textContent = `© ${new Date().getFullYear()} ${PROFILE.nama}`;

    const navEl = document.getElementById("site-nav");
    navEl.innerHTML = `<a href="#about">About</a>` +
      PROFILE.sosmed.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>`).join("") +
      `<a href="mailto:${PROFILE.email}">Email</a>`;

    document.getElementById("footer-links").innerHTML =
      `<a href="mailto:${PROFILE.email}" style="color:inherit;text-decoration:none;">${PROFILE.email}</a>`;

    document.getElementById("skills-list").innerHTML =
      PROFILE.skills.map(skill => `<span class="tag">${skill}</span>`).join("");

    const gridEl = document.getElementById("projects-grid");
    PROJECTS.forEach((proj, index) => {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div class="card-thumb">
          <img src="${proj.thumbnail}" alt="${proj.title}" loading="lazy" />
        </div>
        <div class="card-body">
          <div class="card-top">
            <h3 class="card-title">${proj.title}</h3>
            <span class="card-year">${proj.year}</span>
          </div>
          <div class="card-role">${proj.role}</div>
          <div class="card-hint">Lihat kontribusi →</div>
        </div>
      `;
      card.addEventListener("click", () => openModal(index));
      gridEl.appendChild(card);
    });

    const backdrop = document.getElementById("modal-backdrop");
    const closeBtn = document.getElementById("modal-close");

    function openModal(index) {
      const p = PROJECTS[index];
      document.getElementById("modal-hero").src = p.thumbnail;
      document.getElementById("modal-hero").alt = p.title;
      document.getElementById("modal-title").textContent = p.title;
      document.getElementById("modal-tagline").textContent = p.tagline;
      document.getElementById("modal-overview").textContent = p.overview;

      document.getElementById("modal-links").innerHTML = (p.links || [])
        .map(l => `<a class="btn-link ${l.primary ? "" : "secondary"}" href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`)
        .join("");

      document.getElementById("modal-meta").innerHTML = Object.entries(p.meta || {})
        .map(([k, v]) => `<div class="meta-item"><span>${k}</span><strong>${v}</strong></div>`)
        .join("");

      document.getElementById("modal-contributions").innerHTML = (p.contributions || [])
        .map(c => `<li>${c}</li>`)
        .join("");

      const galSection = document.getElementById("modal-gallery-section");
      const galEl = document.getElementById("modal-gallery");
      if (p.gallery && p.gallery.length > 0) {
        galSection.style.display = "block";
        galEl.innerHTML = p.gallery.map(g => `
          <div class="gallery-item">
            <img src="${g.img}" alt="${g.caption || p.title}" loading="lazy" />
            ${g.caption ? `<div class="gallery-caption">${g.caption}</div>` : ""}
          </div>
        `).join("");
      } else {
        galSection.style.display = "none";
      }

      backdrop.classList.add("open");
      backdrop.scrollTop = 0;
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      backdrop.classList.remove("open");
      document.body.style.overflow = "";
    }

    closeBtn.addEventListener("click", closeModal);
    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });
  </script>
</body>
</html>
